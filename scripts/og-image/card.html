<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
html,body{margin:0;width:1200px;height:630px;overflow:hidden;background:#0a121c}
.card{position:relative;width:1200px;height:630px;overflow:hidden;font-family:'Barlow',sans-serif;color:#eef3f8}
.card img.bg{position:absolute;left:-40px;top:-140px;width:1280px;height:auto}
.shade{position:absolute;inset:0;background:
 linear-gradient(90deg,#0a121cf0 0%,#0a121cb8 32%,#0a121c30 60%,#0a121c10 100%),
 linear-gradient(180deg,#0a121c66 0%,#0000 24%,#0000 55%,#0a121cf2 100%)}
.frame{position:absolute;inset:22px;border:1px solid #9fb6d040;pointer-events:none}
.corner{position:absolute;width:26px;height:26px;border:2px solid #ff8f3a;}
.corner.tl{left:22px;top:22px;border-right:0;border-bottom:0}
.corner.tr{right:22px;top:22px;border-left:0;border-bottom:0}
.corner.bl{left:22px;bottom:22px;border-right:0;border-top:0}
.corner.br{right:22px;bottom:22px;border-left:0;border-top:0}
.title{position:absolute;left:72px;top:112px}
.eyebrow{display:flex;align-items:center;gap:14px;font-family:'Barlow Condensed';font-size:22px;font-weight:600;letter-spacing:5px;color:#ff8f3a}
.eyebrow i{display:block;width:44px;height:2px;background:#ff8f3a}
h1{margin:10px 0 0;font-family:'Barlow Condensed';font-size:172px;font-weight:600;letter-spacing:.055em;line-height:.9;text-transform:uppercase;color:#fbfcf7;text-shadow:0 8px 40px #05080ae0}
.sub{margin:18px 0 0 6px;font-family:'Barlow Condensed';font-size:38px;font-weight:500;letter-spacing:1px;color:#eef3f8;text-shadow:0 2px 14px #05080ae0}
.strip{position:absolute;left:72px;right:72px;bottom:62px;display:flex;align-items:center;justify-content:space-between}
.tags{display:flex;gap:10px}
.tag{padding:9px 16px;font-family:'Barlow Condensed';font-size:20px;font-weight:600;letter-spacing:2.5px;text-transform:uppercase;color:#a9dcff;background:#0f1823cc;border:1px solid #9fb6d040;border-radius:3px}
.tag.hot{color:#ffc48a;border-color:#ff8f3a80}
.url{display:flex;align-items:center;gap:10px;font-family:'Barlow Condensed';font-size:26px;font-weight:600;letter-spacing:2px;color:#9db0c4}
.dot{width:10px;height:10px;border-radius:50%;background:#8fd97a;box-shadow:0 0 12px #8fd97a}
</style></head><body><div class="card">
<img class="bg" src="../../public/art/interface/home-vista.jpg">
<div class="shade"></div>
<div class="frame"></div><i class="corner tl"></i><i class="corner tr"></i><i class="corner bl"></i><i class="corner br"></i>
<div class="title">
 <div class="eyebrow"><i></i>NORTHERN COMMAND</div>
 <h1>Noordheim</h1>
 <div class="sub">Hold the coast. Command the north.</div>
</div>
<div class="strip">
 <div class="tags"><span class="tag hot">Persistent multiplayer</span><span class="tag">Base building</span><span class="tag">Real-time strategy</span></div>
 <div class="url"><span class="dot"></span>noordheim.com</div>
</div>
</div></body></html>
